<div class=" w-full flex  mt-5 justify-center items-center">
  <form [formGroup]="specialtyForm" class="grid grid-cols-1 gap-4 w-full max-w-md" >
    <mat-form-field >
      <mat-label>Nombre</mat-label>
      <input matInput type="text" placeholder="Ingrese el nombre de la especialidad" formControlName="nombre">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Descripción</mat-label>
      <input matInput type="text" placeholder="Ingrese la descripción de la especialidad" formControlName="descripcion">
    </mat-form-field>

    <button type="submit" mat-raised-button color="primary">Guardar</button>
  </form>
</div>
