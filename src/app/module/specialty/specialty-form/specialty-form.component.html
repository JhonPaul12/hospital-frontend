<div class=" w-full flex  mt-5 justify-center items-center">
  <form [formGroup]="specialtyForm" class="grid grid-cols-1 gap-4 w-full max-w-md" >
    <mat-form-field >
      <mat-label>Nombre</mat-label>
      <input matInput type="text" placeholder="Ingrese el nombre de la especialidad" formControlName="name">
    </mat-form-field>

    <mat-form-field >
      <mat-label>Descripción</mat-label>
      <input matInput type="text" placeholder="Ingrese la descripción de la especialidad" formControlName="description">
    </mat-form-field>


    @if (operation) {

      <button mat-flat-button color="primary" (click)="location.back()">Volver</button>
      <button mat-flat-button color="primary" (click)="updateSpecialty()">Actualizar</button>
    }
    @else {
      <button mat-flat-button color="primary"(click)="this.dialogRef.close(true)">Volver</button>
      <button mat-flat-button color="primary" (click)="createSpecialty()">Registrar</button>
    }

  </form>
</div>
